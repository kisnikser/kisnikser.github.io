<div class="social-icons" {{ with .align}}align="{{.}}" {{- end }}>
    {{- range site.Params.socialIcons }}
    {{- if eq (trim .name " " | lower) "email" }}
    {{- /* Clicking mails no one: the address is copied to the clipboard instead (see footer.html for the handler). */}}
    <a href="{{ trim .url " " | safeURL }}" class="js-copy-email" target="_blank" rel="noopener noreferrer me"
        title="{{ (.title | default .name) | title }} (click to copy)">
        {{ partial "svg.html" . }}
    </a>
    {{- else }}
    <a href="{{ trim .url " " | safeURL }}" target="_blank" rel="noopener noreferrer me"
        title="{{ (.title | default .name) | title }}">
        {{ partial "svg.html" . }}
    </a>
    {{- end }}
    {{- end }}
</div>
